[package]
name = "cangjie-color"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CangJie letter-code hieroglyph stroke colorizer."
repository = "https://github.com/mova-ITS/cangjie-color"
keywords = ["cangjie", "cjk", "svg", "education"]
categories = ["text-processing", "visualization"]
readme = "README.md"

[[bin]]
name = "cj-color"
path = "src/main.rs"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2"
